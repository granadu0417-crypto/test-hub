{{ define "head" }}
<!-- Quiz Schema for Test Pages -->
{{ if .Params.questions }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Quiz",
    "name": "{{ .Title }}",
    "description": "{{ .Description }}",
    "url": "{{ .Permalink }}",
    "inLanguage": "ko-KR",
    "educationalLevel": "일반",
    "numberOfQuestions": {{ len .Params.questions }},
    "timeRequired": "PT{{ if .Params.duration }}{{ .Params.duration | replaceRE "[^0-9]" "" }}{{ else }}3{{ end }}M",
    "provider": {
        "@type": "Organization",
        "name": "{{ .Site.Title }}",
        "url": "{{ .Site.BaseURL }}"
    },
    "about": {
        "@type": "Thing",
        "name": "심리테스트",
        "description": "{{ if .Params.summary }}{{ .Params.summary }}{{ else }}재미있는 심리 테스트{{ end }}"
    }
}
</script>
{{ end }}
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }

    main {
        padding-bottom: 60px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
    }
</style>
{{ end }}

{{ define "main" }}
<div class="container">
    <!-- Test Introduction -->
    {{ partial "test-intro.html" . }}

    <!-- Test Content (Questions & Results) -->
    {{ partial "test-content.html" . }}

    <!-- Share Buttons -->
    {{ partial "share-buttons.html" . }}
</div>
{{ end }}

{{ define "scripts" }}
<script>
    // Test Data (from front matter)
    const testData = {{ dict "id" .File.BaseFileName "title" .Title "questions" .Params.questions "results" .Params.results | jsonify | safeJS }};

    // Initialize test engine
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize test counter
        incrementTestCounter(testData.id);

        // Initialize test engine
        initTest(testData);
    });
</script>
{{ end }}
