{{ define "head" }}
<!-- Zodiac Fortune Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "{{ .Title }}",
    "description": "{{ .Description }}",
    "url": "{{ .Permalink }}",
    "applicationCategory": "EntertainmentApplication",
    "operatingSystem": "Any",
    "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
    },
    "provider": {
        "@type": "Organization",
        "name": "{{ .Site.Title }}",
        "url": "{{ .Site.BaseURL }}"
    },
    "inLanguage": "ko-KR"
}
</script>
<link rel="stylesheet" href="/css/fortune.css?v=20260102">
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        min-height: 100vh;
    }

    /* 입력 화면 */
    .fortune-input-container {
        max-width: 700px;
        margin: 60px auto;
        padding: 60px 40px;
        background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(49, 46, 129, 0.9));
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(30, 27, 75, 0.4);
        border: 2px solid rgba(251, 191, 36, 0.3);
        position: relative;
        overflow: hidden;
    }

    .fortune-input-title {
        text-align: center;
        font-size: 2.5rem;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
        font-weight: 900;
    }

    .fortune-input-subtitle {
        text-align: center;
        color: #cbd5e1;
        font-size: 1.15rem;
        margin-bottom: 48px;
        line-height: 1.8;
    }

    .birth-date-inputs {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
    }

    .input-group {
        flex: 1;
        max-width: 200px;
    }

    .input-label {
        display: block;
        color: #fbbf24;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 8px;
        text-align: center;
    }

    .birth-input {
        width: 100%;
        padding: 18px;
        border-radius: 16px;
        border: 2px solid rgba(251, 191, 36, 0.3);
        background: rgba(15, 23, 42, 0.5);
        color: white;
        font-size: 1.2rem;
        text-align: center;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .birth-input:focus {
        outline: none;
        border-color: #fbbf24;
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
    }

    .zodiac-preview {
        min-height: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .zodiac-preview.visible {
        opacity: 1;
    }

    .zodiac-preview-icon {
        font-size: 5rem;
        margin-bottom: 12px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .zodiac-preview-name {
        font-size: 1.8rem;
        color: #fbbf24;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .zodiac-preview-info {
        font-size: 1.05rem;
        color: #cbd5e1;
    }

    .submit-button {
        display: block;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1e1b4b;
        border: none;
        border-radius: 50px;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
    }

    .submit-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .submit-button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(251, 191, 36, 0.5);
    }

    /* 결과 화면 */
    .fortune-result-container {
        max-width: 900px;
        margin: 60px auto;
        padding: 60px 40px;
        background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(49, 46, 129, 0.9));
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(30, 27, 75, 0.4);
        border: 2px solid rgba(251, 191, 36, 0.3);
    }

    @media (max-width: 768px) {
        .birth-date-inputs {
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            max-width: 100%;
        }

        .fortune-input-container,
        .fortune-result-container {
            margin: 20px;
            padding: 40px 24px;
        }
    }
</style>
{{ end }}

<script src="/js/fortune-engine.js?v=20260102"></script>
<script>
    const birthMonthInput = document.getElementById('birthMonthInput');
    const birthDayInput = document.getElementById('birthDayInput');
    const zodiacPreview = document.getElementById('zodiacPreview');
    const submitButton = document.getElementById('submitButton');
    const inputSection = document.getElementById('inputSection');
    const resultSection = document.getElementById('resultSection');

    // 선택된 시간대 및 저장된 생년월일
    let selectedPeriod = 'today';
    let savedMonth = null;
    let savedDay = null;

    // 시간대 탭 전환 (입력 화면)
    document.querySelectorAll('.period-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            // 모든 탭 비활성화 스타일
            document.querySelectorAll('.period-tab').forEach(t => {
                t.style.background = 'rgba(251, 191, 36, 0.1)';
                t.style.color = '#fbbf24';
                t.style.border = '2px solid rgba(251, 191, 36, 0.3)';
                t.style.boxShadow = 'none';
                t.classList.remove('active');
            });

            // 현재 탭 활성화
            this.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
            this.style.color = '#1e1b4b';
            this.style.border = 'none';
            this.style.boxShadow = '0 4px 12px rgba(251, 191, 36, 0.3)';
            this.classList.add('active');

            selectedPeriod = this.dataset.period;
        });
    });

    // 시간대 탭 전환 (결과 화면) - 즉시 업데이트
    function initResultPeriodTabs() {
        document.querySelectorAll('.result-period-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 모든 탭 비활성화 스타일
                document.querySelectorAll('.result-period-tab').forEach(t => {
                    t.style.background = 'rgba(251, 191, 36, 0.1)';
                    t.style.color = '#fbbf24';
                    t.style.border = '2px solid rgba(251, 191, 36, 0.3)';
                    t.style.boxShadow = 'none';
                    t.classList.remove('active');
                });

                // 현재 탭 활성화
                this.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
                this.style.color = '#1e1b4b';
                this.style.border = 'none';
                this.style.boxShadow = '0 4px 12px rgba(251, 191, 36, 0.3)';
                this.classList.add('active');

                selectedPeriod = this.dataset.period;

                // 저장된 월/일로 운세 즉시 업데이트
                if (savedMonth && savedDay) {
                    updateFortuneResult(savedMonth, savedDay, selectedPeriod);
                }
            });
        });
    }

    // 입력값 검증 및 미리보기 업데이트
    function updatePreview() {
        const month = parseInt(birthMonthInput.value);
        const day = parseInt(birthDayInput.value);

        if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
            try {
                const zodiacKey = getZodiacByBirthdate(month, day);
                const zodiac = WESTERN_ZODIAC[zodiacKey];

                zodiacPreview.classList.add('visible');
                zodiacPreview.innerHTML = `
                    <div class="zodiac-preview-icon">${zodiac.icon}</div>
                    <div class="zodiac-preview-name">${zodiac.name}</div>
                    <div class="zodiac-preview-info">${zodiac.symbol} • ${zodiac.trait}</div>
                `;

                submitButton.disabled = false;
            } catch (e) {
                console.error('별자리 계산 오류:', e);
                resetPreview();
            }
        } else {
            resetPreview();
        }
    }

    function resetPreview() {
        zodiacPreview.classList.remove('visible');
        zodiacPreview.innerHTML = '';
        submitButton.disabled = true;
    }

    // 입력 이벤트 리스너
    birthMonthInput.addEventListener('input', updatePreview);
    birthDayInput.addEventListener('input', updatePreview);

    // Enter 키로 제출
    birthMonthInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !submitButton.disabled) {
            showFortune();
        }
    });
    birthDayInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !submitButton.disabled) {
            showFortune();
        }
    });

    // 별점 표시 함수
    function getStars(score) {
        const starCount = Math.round(score / 20);
        return '⭐'.repeat(starCount);
    }

    // 운세 확인 버튼
    submitButton.addEventListener('click', showFortune);

    // 운세 결과 렌더링 (공통 함수)
    function renderFortuneResult(fortune, period) {
        // 시간대별 제목
        const periodTitles = {
            today: '🌟 오늘의 종합 운세',
            week: '🌟 이번주 종합 운세',
            month: '🌟 이번달 종합 운세',
            year: '🌟 올해 종합 운세'
        };
        document.getElementById('resultPeriodTitle').textContent = periodTitles[period];

        // 별자리 정보
        document.getElementById('resultIcon').textContent = fortune.zodiac.icon;
        document.getElementById('resultName').textContent = fortune.zodiac.name;
        document.getElementById('resultInfo').innerHTML = `
            <span><strong>원소:</strong> ${fortune.zodiac.symbol}</span>
            <span><strong>특성:</strong> ${fortune.zodiac.trait}</span>
            <span><strong>기간:</strong> ${fortune.periodLabel}</span>
        `;

        // 종합 점수
        document.getElementById('resultTotalScore').textContent = fortune.scores.total + '점';
        document.getElementById('resultTotalStars').textContent = getStars(fortune.scores.total);

        // 세부 점수
        document.getElementById('resultLoveScore').textContent = fortune.scores.love + '점';
        document.getElementById('resultLoveStars').textContent = getStars(fortune.scores.love);

        document.getElementById('resultMoneyScore').textContent = fortune.scores.money + '점';
        document.getElementById('resultMoneyStars').textContent = getStars(fortune.scores.money);

        document.getElementById('resultWorkScore').textContent = fortune.scores.work + '점';
        document.getElementById('resultWorkStars').textContent = getStars(fortune.scores.work);

        // 행운의 아이템
        document.getElementById('resultLuckyColor').textContent = fortune.luckyColor.name;
        document.getElementById('resultLuckyNumber').textContent = fortune.luckyNumber;

        // 운세 메시지
        const messagesHtml = fortune.messages.map(msg => `
            <div style="background: rgba(251, 191, 36, 0.1); border-left: 4px solid #fbbf24; border-radius: 12px; padding: 20px; color: #e2e8f0; font-size: 1.05rem; line-height: 1.8;">
                ${msg}
            </div>
        `).join('');
        document.getElementById('resultMessages').innerHTML = messagesHtml;

        // 결과 화면 탭의 active 상태 업데이트
        document.querySelectorAll('.result-period-tab').forEach(tab => {
            if (tab.dataset.period === period) {
                tab.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
                tab.style.color = '#1e1b4b';
                tab.style.border = 'none';
                tab.style.boxShadow = '0 4px 12px rgba(251, 191, 36, 0.3)';
                tab.classList.add('active');
            } else {
                tab.style.background = 'rgba(251, 191, 36, 0.1)';
                tab.style.color = '#fbbf24';
                tab.style.border = '2px solid rgba(251, 191, 36, 0.3)';
                tab.style.boxShadow = 'none';
                tab.classList.remove('active');
            }
        });
    }

    // 처음 운세 확인 (화면 전환)
    function showFortune() {
        const month = parseInt(birthMonthInput.value);
        const day = parseInt(birthDayInput.value);

        console.log('운세 확인:', month, day, '기간:', selectedPeriod);

        try {
            // 월/일 저장
            savedMonth = month;
            savedDay = day;

            const fortune = getZodiacFortune(month, day, selectedPeriod);
            console.log('운세 결과:', fortune);

            renderFortuneResult(fortune, selectedPeriod);

            // 화면 전환
            inputSection.style.display = 'none';
            resultSection.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 결과 화면 탭 이벤트 초기화
            initResultPeriodTabs();
        } catch (error) {
            console.error('운세 생성 오류:', error);
            alert('운세를 생성하는 중 오류가 발생했습니다. 다시 시도해주세요.');
        }
    }

    // 결과 화면에서 시간대만 변경 (스크롤 유지)
    function updateFortuneResult(month, day, period) {
        console.log('운세 업데이트:', month, day, '기간:', period);

        try {
            const fortune = getZodiacFortune(month, day, period);
            console.log('운세 결과:', fortune);

            renderFortuneResult(fortune, period);
            // 스크롤은 유지됨 (화면 전환 없음)
        } catch (error) {
            console.error('운세 업데이트 오류:', error);
            alert('운세를 업데이트하는 중 오류가 발생했습니다. 다시 시도해주세요.');
        }
    }

    // 다시하기
    function resetFortune() {
        inputSection.style.display = 'block';
        resultSection.style.display = 'none';
        birthMonthInput.value = '';
        birthDayInput.value = '';
        resetPreview();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 페이스북 공유
    function shareFacebook() {
        const url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank', 'width=600,height=400');
    }

    // 링크 복사
    function copyLink() {
        const copyBtn = document.getElementById('copyBtn');
        const url = window.location.href;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                copyBtn.innerHTML = '<span style="font-size: 1.3rem;">✅</span> 복사 완료!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<span style="font-size: 1.3rem;">🔗</span> 링크 복사';
                }, 2000);
            }).catch(() => {
                fallbackCopyLink(url, copyBtn);
            });
        } else {
            fallbackCopyLink(url, copyBtn);
        }
    }

    function fallbackCopyLink(url, btn) {
        const textArea = document.createElement('textarea');
        textArea.value = url;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        document.body.appendChild(textArea);
        textArea.select();

        try {
            document.execCommand('copy');
            btn.innerHTML = '<span style="font-size: 1.3rem;">✅</span> 복사 완료!';
            setTimeout(() => {
                btn.innerHTML = '<span style="font-size: 1.3rem;">🔗</span> 링크 복사';
            }, 2000);
        } catch (err) {
            alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
        }

        document.body.removeChild(textArea);
    }

    // 이미지 저장 함수
    async function downloadFortuneImage() {
        const downloadBtn = document.querySelector('.download-text');
        if (downloadBtn) {
            downloadBtn.textContent = '생성 중...';
        }

        try {
            // html2canvas가 로드되었는지 확인
            if (typeof html2canvas === 'undefined') {
                throw new Error('html2canvas가 로드되지 않았습니다.');
            }

            const resultContainer = document.querySelector('.fortune-result-container');
            if (!resultContainer) {
                throw new Error('결과를 찾을 수 없습니다.');
            }

            // 공유 버튼 섹션 숨기기 (캡처에서 제외)
            const shareSection = document.querySelector('.share-section-fortune');
            const originalDisplay = shareSection ? shareSection.style.display : '';
            if (shareSection) shareSection.style.display = 'none';

            // 다시하기 버튼 숨기기
            const resetBtn = resultContainer.nextElementSibling;
            const resetBtnDisplay = resetBtn ? resetBtn.style.display : '';
            if (resetBtn && resetBtn.querySelector('button[onclick="resetFortune()"]')) {
                resetBtn.style.display = 'none';
            }

            // 배경색 임시 설정
            const originalBg = resultContainer.style.background;
            resultContainer.style.background = 'linear-gradient(135deg, #1e1b4b, #312e81)';

            // 브랜드 워터마크 추가
            const watermark = document.createElement('div');
            watermark.style.cssText = 'text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid rgba(251, 191, 36, 0.3); font-size: 14px; color: #fbbf24; font-weight: 600;';
            watermark.innerHTML = '✨ natest.kr에서 더 많은 운세를 확인하세요!';
            resultContainer.appendChild(watermark);

            // html2canvas로 캡처
            const canvas = await html2canvas(resultContainer, {
                backgroundColor: '#1e1b4b',
                scale: 2, // 고해상도
                logging: false,
                useCORS: true,
                allowTaint: true,
                width: resultContainer.scrollWidth,
                height: resultContainer.scrollHeight
            });

            // 워터마크 제거
            resultContainer.removeChild(watermark);

            // 공유 버튼 섹션 복원
            if (shareSection) shareSection.style.display = originalDisplay;

            // 다시하기 버튼 복원
            if (resetBtn) resetBtn.style.display = resetBtnDisplay;

            // 배경 복원
            resultContainer.style.background = originalBg;

            // Canvas를 Blob으로 변환
            canvas.toBlob((blob) => {
                if (!blob) {
                    throw new Error('이미지 생성에 실패했습니다.');
                }

                // 파일명 생성
                const zodiacName = document.getElementById('resultName').textContent || '별자리';
                const today = new Date();
                const dateStr = `${today.getMonth() + 1}월${today.getDate()}일`;
                const periodNames = {
                    today: '오늘의운세',
                    week: '이번주운세',
                    month: '이번달운세',
                    year: '올해운세'
                };
                const fileName = `${zodiacName}_${periodNames[selectedPeriod]}_${dateStr}.png`;

                // 다운로드
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                // 버튼 텍스트 변경
                if (downloadBtn) {
                    downloadBtn.textContent = '저장 완료!';
                    setTimeout(() => {
                        downloadBtn.textContent = '이미지 저장';
                    }, 2000);
                }
            }, 'image/png');

        } catch (error) {
            console.error('이미지 다운로드 실패:', error);
            alert('이미지 저장에 실패했습니다. 다시 시도해주세요.');

            // 버튼 텍스트 복원
            if (downloadBtn) {
                downloadBtn.textContent = '이미지 저장';
            }
        }
    }

    // ========================================
    // 아코디언 시스템
    // ========================================

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        const button = content.previousElementSibling;
        const icon = button.querySelector('.accordion-icon');

        if (content.style.maxHeight && content.style.maxHeight !== '0px') {
            // 접기
            content.style.maxHeight = '0px';
            content.style.opacity = '0';
            content.style.paddingTop = '0';
            content.style.paddingBottom = '0';
            icon.style.transform = 'rotate(0deg)';
            button.setAttribute('aria-expanded', 'false');
        } else {
            // 펼치기
            content.style.maxHeight = content.scrollHeight + 'px';
            content.style.opacity = '1';
            content.style.paddingTop = '0';
            content.style.paddingBottom = '0';
            icon.style.transform = 'rotate(180deg)';
            button.setAttribute('aria-expanded', 'true');

            // 콘텐츠 높이가 변경될 수 있으므로 약간 여유를 둠
            setTimeout(() => {
                content.style.maxHeight = (content.scrollHeight + 50) + 'px';
            }, 100);
        }
    }

    // 페이지 로드 시 아코디언 초기화
    function initializeAccordions() {
        const isMobile = window.innerWidth <= 768;
        const accordions = ['detailFortune', 'luckyItems', 'fortuneMessages'];

        accordions.forEach(id => {
            const content = document.getElementById(id);
            const button = content.previousElementSibling;
            const icon = button.querySelector('.accordion-icon');

            if (isMobile) {
                // 모바일: 기본 접힘
                content.style.maxHeight = '0px';
                content.style.opacity = '0';
                icon.style.transform = 'rotate(0deg)';
                button.setAttribute('aria-expanded', 'false');
            } else {
                // PC: 기본 펼침
                content.style.maxHeight = (content.scrollHeight + 50) + 'px';
                content.style.opacity = '1';
                icon.style.transform = 'rotate(180deg)';
                button.setAttribute('aria-expanded', 'true');
            }
        });
    }

    // 결과 표시 후 아코디언 초기화
    // (기존 showResult 함수가 호출된 후)
    const originalShowResult = window.showFortuneResult || (() => {});
    window.showFortuneResult = function() {
        originalShowResult.apply(this, arguments);
        setTimeout(initializeAccordions, 100);
    };

    // 화면 크기 변경 시 재초기화
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const accordions = ['detailFortune', 'luckyItems', 'fortuneMessages'];
            accordions.forEach(id => {
                const content = document.getElementById(id);
                if (content.style.opacity === '1') {
                    content.style.maxHeight = (content.scrollHeight + 50) + 'px';
                }
            });
        }, 250);
    });
